{% extends 'base.html' %}
{% block content %}
    {% load widget_tweaks %}
<section id="form"><!--form-->
    <div class="container-fluid bg-light py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow rounded-lg">
                    <div class="card-body">
                        <h2 class="text-success text-center mb-4">New User Signup!</h2>
                        <form method="POST">
                            {% csrf_token %}
                            {% for field in form %}
                                <div class="mb-3">
                                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                </div>
                                <div class="mb-3">
                                    {{ field.errors }}
                                    {{ field|add_class:"form-control full-width-input" }} <!-- Apply classes directly -->
                                </div>
                            {% endfor %}
                            <div class="d-grid gap-2">
                                <button class="btn btn-success rounded-pill" type="submit">Signup</button>
                            </div>
                            <div class="mt-3 text-center">
                                <span>Already have an account?</span>&nbsp;<a href="{% url 'login' %}" class="text-decoration-none">Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
